name: Publish MAGIC GUARD
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir _site
          cp *.html *.css *.js *.svg *.webp .nojekyll _site/
          curl --fail --location --retry 3 'https://images.pexels.com/photos/7709145/pexels-photo-7709145.jpeg?auto=compress&w=900' --output _site/team-support.jpg
          curl --fail --location --retry 3 'https://images.pexels.com/photos/7709164/pexels-photo-7709164.jpeg?auto=compress&w=900' --output _site/team-technical.jpg
          curl --fail --location --retry 3 'https://images.pexels.com/photos/7710178/pexels-photo-7710178.jpeg?auto=compress&w=900' --output _site/team-partners.jpg
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
